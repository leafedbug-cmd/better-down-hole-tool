<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BDHT Email Templates Preview (18 Templates)</title>
  <style>
    :root {
      --bg: #07090d;
      --bg-2: #0e131a;
      --panel: #141b24;
      --panel-2: #1c2531;
      --line: #314052;
      --ink: #f2f6fb;
      --mute: #b7c3d1;
      --amber: #f0b429;
      --amber-2: #ffd56a;
      --amber-ink: #1a1303;
      --cyan: #7dffe0;
      --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(7, 9, 13, 0.96);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { height: 34px; width: auto; }
    .brand-meta small { display: block; color: var(--amber-2); font-size: 11px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }
    .brand-meta b { font-size: 15px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .seg {
      display: inline-flex;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--mute);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 7px 12px;
      border-radius: 7px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background: var(--amber);
      color: var(--amber-ink);
    }
    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      flex: 1;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }
    .sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--line);
      padding: 14px;
      overflow-y: auto;
      max-height: calc(100vh - 64px);
      position: sticky;
      top: 64px;
    }
    .cat-head {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber-2);
      margin: 16px 6px 8px;
    }
    .cat-head:first-child { margin-top: 4px; }
    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink);
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .nav-btn:hover { background: var(--panel); }
    .nav-btn.active {
      background: var(--panel-2);
      border-color: var(--amber);
    }
    .nav-num {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 800;
      color: var(--amber-2);
      background: var(--bg);
      padding: 2px 6px;
      border-radius: 6px;
      flex: none;
    }
    .stage {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .tpl-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .tpl-meta {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
    }
    .tpl-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .tpl-title { font-size: 18px; font-weight: 900; text-transform: uppercase; }
    .pill {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--cyan);
    }
    .meta-row { font-size: 13px; color: var(--mute); }
    .meta-row b { color: var(--ink); }
    .vars { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
    .vars code {
      font-family: var(--mono);
      font-size: 12px;
      background: var(--bg);
      color: var(--amber-2);
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .frame-wrap {
      padding: 24px;
      background: #0b0f15;
      display: flex;
      justify-content: center;
    }
    .email-frame {
      width: 640px;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f2f6fb;
      transition: width 0.2s ease;
    }
    body[data-viewport="mobile"] .email-frame {
      width: 375px;
    }
    .txt-view {
      display: none;
      width: 640px;
      max-width: 100%;
      background: var(--bg);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      margin: 0;
    }
    body[data-format="txt"] .email-frame { display: none; }
    body[data-format="txt"] .txt-view { display: block; }
  </style>
</head>

  <div class="workspace">

    <main class="stage" id="stage"></main>
  </div>

-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;font-weight:800;\">\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Main Body -->\n          <tr>\n            <td class=\"bdht-pad\" style=\"padding:28px;\">\n              <p class=\"bdht-kicker\" style=\"margin:0 0 6px 0;font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:14px;line-height:18px;font-weight:900;letter-spacing:0.12em;text-transform:uppercase;color:#9a6700;\">\n                Account setup\n              </p>\n              <h1 class=\"bdht-h1\" style=\"margin:0 0 18px 0;font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:24px;line-height:30px;font-weight:900;letter-spacing:-0.01em;text-transform:uppercase;color:#07090d;\">\n                Confirm your email address\n              </h1>\n\n              <p class=\"bdht-text\" style=\"margin:0 0 16px 0;font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;color:#07090d;\">Hello Jake,</p>\n      <p class=\"bdht-text\" style=\"margin:0 0 16px 0;font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;color:#07090d;\">Use the button below to confirm <strong>jake@ozarkboring.example</strong> and finish setting up your crew account on The Better Down Hole Tool.</p>\n      <p class=\"bdht-text\" style=\"margin:0 0 16px 0;font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;line-height:24px;color:#07090d;\">Once confirmed, sign in to add your company and save loadouts on up to 3 machines for free.</p>\n              \n
